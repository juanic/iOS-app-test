name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run shared tests
        run: |
          chmod +x gradlew
          ./gradlew :shared:jvmTest --console=plain

  ios-build:
    name: Build iOS app (simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Link Kotlin framework
        run: |
          chmod +x gradlew
          if [ "$(uname -m)" = "arm64" ]; then
            TASK=linkDebugFrameworkIosSimulatorArm64
            BIN=iosSimulatorArm64
          else
            TASK=linkDebugFrameworkIosX64
            BIN=iosX64
          fi
          echo "Host arch: $(uname -m) -> :shared:$TASK"
          ./gradlew :shared:$TASK --console=plain
          mkdir -p shared/build/xcode-frameworks
          cp -R shared/build/bin/$BIN/debugFramework/Shared.framework shared/build/xcode-frameworks/
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
