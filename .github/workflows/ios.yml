name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run shared tests
        run: |
          chmod +x gradlew
          ./gradlew :shared:jvmTest --console=plain

  ios-build:
    name: Build iOS app (simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Link Kotlin frameworks and merge for simulator
        run: |
          chmod +x gradlew
          ./gradlew :shared:linkDebugFrameworkIosX64 :shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
          mkdir -p shared/build/xcode-frameworks
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework shared/build/xcode-frameworks/
          lipo -create \
            shared/build/bin/iosX64/debugFramework/Shared.framework/Shared \
            shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework/Shared \
            -output shared/build/xcode-frameworks/Shared.framework/Shared
          echo "--- header symbols ---"
          grep -nE "SessionMetricsSnapshot|CopEllipse|SessionRecorder|compute\(" shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework/Headers/Shared.h || true
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
